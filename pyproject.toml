[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unimri"
version = "0.0.0"
description = "A unified Python framework for MRI raw-data processing and reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Istiyak Amin Santo" }]
keywords = ["mri", "reconstruction", "k-space", "ismrmrd", "twix", "non-cartesian", "nufft"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
ismrmrd = ["ismrmrd>=1.14"]
torch = ["torch>=2.1"]
gpu = ["cupy-cuda12x>=13.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/istiyakamin/UniMRI"
Repository = "https://github.com/istiyakamin/UniMRI"
Documentation = "https://github.com/istiyakamin/UniMRI/tree/main/docs"
Issues = "https://github.com/istiyakamin/UniMRI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/unimri"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["unimri"]

[tool.mypy]
# Type-checking target. Kept at 3.12 because NumPy's bundled stubs use `type`
# statements that older targets cannot parse; the package itself still runs on
# 3.10+ (enforced by `requires-python` and the CI test matrix).
python_version = "3.12"
packages = ["unimri"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/unimri"]
