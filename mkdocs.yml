site_name: UniMRI
site_description: A unified Python framework for MRI raw-data processing and reconstruction
site_url: https://istiyakamin.github.io/UniMRI/
repo_url: https://github.com/istiyakamin/UniMRI
repo_name: istiyakamin/UniMRI
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data model: data-model.md
  - I/O and formats: io-format-support.md
  - Roadmap: roadmap.md
  - Prior art: prior-art.md
  - Acknowledgments: acknowledgments.md
  - API reference:
      - Overview: reference/index.md
      - Data model: reference/data-model.md
      - I/O: reference/io.md
      - Operators: reference/operators.md
      - Calibration: reference/calibration.md
      - Optimization: reference/optimization.md
      - Reconstruction: reference/reconstruction.md
      - Testing utilities: reference/testing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: numpy
