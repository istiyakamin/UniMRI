site_name: UniMRI
site_description: A unified Python framework for MRI raw-data processing and reconstruction
repo_url: https://github.com/istiyakamin/UniMRI
repo_name: istiyakamin/UniMRI
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data model: data-model.md
  - I/O and formats: io-format-support.md
  - Roadmap: roadmap.md
  - Prior art: prior-art.md
  - Acknowledgments: acknowledgments.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: numpy
