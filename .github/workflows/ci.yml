name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest --cov --cov-report=xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy (non-blocking)
        run: uv run mypy src
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel and check
        run: |
          uv build
          uvx twine check dist/*
      - name: Install the built wheel and import it
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/python -c "import unimri; print(unimri.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
